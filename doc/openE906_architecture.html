<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openE906 Architecture</title>
<style>
  :root {
    --background: #ffffff;
    --foreground: #111827;
    --card: #ffffff;
    --muted: #6b7280;
    --blue: #21a3dc;
    --green: #078b12;
    --yellow: #f5d85e;
    --red: #ef7777;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--background); }
</style>
</head>
<body>
<style>
  #opene906-architecture {
    width: 100%;
    color: var(--foreground);
    font-family: "Segoe UI", Arial, "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  }
  #opene906-architecture .desktop-diagram,
  #opene906-architecture .mobile-diagram {
    display: block;
    width: 100%;
    height: auto;
  }
  #opene906-architecture .mobile-diagram { display: none; }
  #opene906-architecture .stage-bg { stroke: var(--foreground); stroke-width: 1.3; stroke-dasharray: 5 4; }
  #opene906-architecture .if-bg { fill: color-mix(in srgb, var(--green) 13%, var(--background)); }
  #opene906-architecture .id-bg { fill: color-mix(in srgb, var(--muted) 55%, var(--background)); }
  #opene906-architecture .ex-bg { fill: color-mix(in srgb, var(--blue) 12%, var(--background)); }
  #opene906-architecture .mem-bg { fill: color-mix(in srgb, var(--yellow) 15%, var(--background)); }
  #opene906-architecture .wb-bg { fill: color-mix(in srgb, var(--red) 12%, var(--background)); }
  #opene906-architecture .memory-bg { fill: color-mix(in srgb, var(--yellow) 12%, var(--background)); }
  #opene906-architecture .box { fill: var(--card); stroke: var(--foreground); stroke-width: 1.6; }
  #opene906-architecture .blue-box { fill: var(--blue); stroke: var(--foreground); stroke-width: 1.6; color: var(--background); }
  #opene906-architecture .green-box { fill: var(--green); stroke: var(--foreground); stroke-width: 1.6; color: var(--background); }
  #opene906-architecture .soft-blue { fill: color-mix(in srgb, var(--blue) 24%, var(--card)); stroke: var(--foreground); stroke-width: 1.4; }
  #opene906-architecture .soft-green { fill: color-mix(in srgb, var(--green) 22%, var(--card)); stroke: var(--foreground); stroke-width: 1.4; }
  #opene906-architecture .soft-red { fill: color-mix(in srgb, var(--red) 20%, var(--card)); stroke: var(--foreground); stroke-width: 1.4; }
  #opene906-architecture .outline { fill: none; stroke: var(--foreground); stroke-width: 7; }
  #opene906-architecture .wire { fill: none; stroke: var(--foreground); stroke-width: 1.7; marker-end: url(#arrow); }
  #opene906-architecture .wire-no-arrow { fill: none; stroke: var(--foreground); stroke-width: 1.5; }
  #opene906-architecture .feedback { fill: none; stroke: var(--green); stroke-width: 2; marker-end: url(#green-arrow); }
  #opene906-architecture .title-strip-blue { fill: var(--blue); }
  #opene906-architecture .title-strip-green { fill: var(--green); }
  #opene906-architecture text { fill: var(--foreground); font-size: 15px; font-weight: 400; }
  #opene906-architecture .on-color { fill: var(--background); font-weight: 500; }
  #opene906-architecture .diagram-title { font-size: 26px; font-weight: 500; }
  #opene906-architecture .stage-label { font-size: 18px; font-weight: 500; }
  #opene906-architecture .lane-label { font-size: 14px; font-weight: 500; font-style: italic; }
  #opene906-architecture .small { font-size: 12px; }
  #opene906-architecture .tiny { font-size: 11px; }
  #opene906-architecture .mono { font-family: Consolas, monospace; }
  @media (max-width: 680px) {
    #opene906-architecture .desktop-diagram { display: none; }
    #opene906-architecture .mobile-diagram { display: block; }
  }
</style>

<div id="opene906-architecture">

    <!-- Memory, protection, and routing -->

    <rect x="676" y="357" width="112" height="52" class="box"/>
